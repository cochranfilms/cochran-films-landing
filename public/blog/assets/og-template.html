<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cochran Films Open Graph template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #000; }
    .card {
      width: 1200px; height: 630px; position: relative; box-sizing: border-box;
      padding: 64px 72px; display: flex; flex-direction: column; justify-content: flex-end;
      background:
        radial-gradient(circle at 100% 0%, rgba(208,54,46,0.55), transparent 42%),
        radial-gradient(circle at 0% 100%, rgba(255,178,0,0.28), transparent 46%),
        #000;
      font-family: "Space Grotesk", Arial, sans-serif;
    }
    img { position: absolute; top: 52px; left: 64px; height: 64px; width: auto; }
    .cat { margin: 0 0 16px; color: #FFB200; letter-spacing: 0.14em; text-transform: uppercase; font-size: 22px; font-weight: 700; }
    h1 { margin: 0; color: #fff; font-size: 64px; line-height: 1.02; letter-spacing: -0.03em; font-weight: 700; max-width: 980px; }
    .bar { position: absolute; right: 0; bottom: 0; width: 180px; height: 12px; background: linear-gradient(90deg, #FFB200, #d0362e); }
  </style>
</head>
<body>
  <div class="card">
    <img src="/CF_Logo_White2025.png" alt="Cochran Films">
    <p class="cat">Category</p>
    <h1>Post title goes here</h1>
    <div class="bar"></div>
  </div>
</body>
</html>
